name: "Publish Container Image"

on:
  push:
    branches: [main]
    tags: ["*"]  # 监听所有标签

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}   # Set in GitHub Secrets
          password: ${{ secrets.DOCKER_PASSWORD }}   # Set in GitHub Secrets

      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${ { secrets.DOCKER_USERNAME }}/$ { { github.repository }}:${{ github.ref_name }}
            ${ { secrets.DOCKER_USERNAME }}/$ { { github.repository }}:latest
